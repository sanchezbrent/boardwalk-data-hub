name: Bug report
description: Report a reproducible failure without private data.
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior and actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version and host API version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Do not include staff tokens, private evidence, unpublished values or production identifiers.
